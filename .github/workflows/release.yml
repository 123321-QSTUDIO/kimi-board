name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build exe
        run: |
          pip install pyinstaller pywebview
          pyinstaller --onefile --name kimi-board --distpath dist --workpath build --specpath build --log-level WARN --hidden-import webview kimi_board.py

      - name: Package release zip
        shell: pwsh
        run: |
          $pkg = "release/kimi-board"
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          Copy-Item dist/kimi-board.exe $pkg/
          Copy-Item start.bat, install-autostart.bat, uninstall-autostart.bat, README.md, LICENSE $pkg/
          Copy-Item -Recurse extension $pkg/
          $tag = ${env:GITHUB_REF_NAME}
          Compress-Archive -Path "$pkg/*" -DestinationPath "release/kimi-board-$tag-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: release/kimi-board-*-windows-x64.zip

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: macos-15-intel  # Intel
            arch: x64
          - runs-on: macos-latest  # Apple Silicon
            arch: arm64
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build binary
        run: |
          pip install pyinstaller
          pyinstaller --onefile --name kimi-board --distpath dist --workpath build --specpath build --log-level WARN kimi_board.py

      - name: Package release zip
        run: |
          pkg="release/kimi-board"
          mkdir -p "$pkg"
          cp dist/kimi-board "$pkg/"
          cp start.sh README.md LICENSE "$pkg/"
          cp -r extension "$pkg/"
          chmod +x "$pkg/kimi-board" "$pkg/start.sh"
          cd release
          zip -r "kimi-board-${GITHUB_REF_NAME}-darwin-${{ matrix.arch }}.zip" kimi-board

      - uses: actions/upload-artifact@v4
        with:
          name: release-darwin-${{ matrix.arch }}
          path: release/kimi-board-*-darwin-*.zip

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Release notes from tag annotation
        run: |
          git fetch -f origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > release-body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          body_path: release-body.md
